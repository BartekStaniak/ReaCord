name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-matrix:
    name: Build on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            cmake_args: -A x64
          - os: macos-latest
            arch: universal
            cmake_args: -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
          - os: ubuntu-latest
            arch: x86_64
            cmake_args: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: cmake -B build ${{ matrix.cmake_args }} -DCMAKE_BUILD_TYPE=Release

      - name: Build ReaCord
        run: cmake --build build --config Release --verbose

      - name: Run Tests
        run: ctest --test-dir build --output-on-failure -C Release --verbose

      - name: Codesign Binary (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          codesign --force --deep -s - build/reaper_reacord.dylib

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: reacord-${{ runner.os }}-${{ matrix.arch }}
          path: |
            build/Release/*.dll
            build/*.dylib
            build/*.so
          if-no-files-found: ignore
